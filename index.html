<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <!-- :::::::::::::::::::::::::: META TAGS :::::::::::::::::::::::::: -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- :::::::::::::::::::::::::: SEO META :::::::::::::::::::::::::: -->
    <title>Synchronized Web Calendar | Ravlo</title>
    <meta name="description" content="This page provides an interactive calendar to accurately view daily dates and specific events with reliable synchronization features.">
    <meta name="robots" content="noindex, nofollow">

    <!-- :::::::::::::::::::::::::: FAVICON & STYLES :::::::::::::::::::::::::: -->
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
    <!-- استایل‌های اختصاصی Ravlo (بعد از حذف کامل بخش‌های سایدبار) -->
    <link rel="stylesheet" href="assets/Ravlo.css">

    <!-- :::::::::::::::::::::::::: TWITTER CARD :::::::::::::::::::::::::: -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Ravlo Calendar">

    <!-- :::::::::::::::::::::::::: CANONICAL & HREFLANG :::::::::::::::::::::::::: -->
    <link rel="canonical" href="https://ravlo.arminsilatani.com/">
</head>
<body>

<!-- =========================== AUTH OVERLAY ============================ -->
<div id="auth-overlay">
    <!-- ... (بدون تغییر) ... -->
</div>

<!-- =========================== APP CONTAINER ============================ -->
<div id="app-container" class="app-hidden">

    <!-- ------------------------- HEADER ------------------------- -->
    <div class="glass-header">
        <!-- ... (بدون تغییر) ... -->
    </div>

    <!-- ------------------------- MAIN CONTENT ------------------------- -->
    <main class="container">
        <!-- ... (بدون تغییر) ... -->
    </main>

    <!-- ------------------------- MODALS ------------------------- -->
    <!-- ... (همهٔ modalها بدون تغییر باقی می‌مانند) ... -->

    <!-- ------------------------- FOOTER ------------------------- -->
    <footer class="footer">
        <!-- ... (بدون تغییر) ... -->
    </footer>

    <!-- ======================== SIDEBAR WEB COMPONENT ======================== -->
    <!-- جایگزین تمام سایدبار قبلی: دکمه همبرگر، overlay، <aside> ... حذف شده‌اند -->
    <sidebar-component current-app="Ravlo Calendar">
        <!-- هر چیزی که داخل slot="app-content" قرار بگیرد به بخش اختصاصی سایدبار رندر می‌شود -->
        <div slot="app-content">
            <!-- دکمه "رویداد/تسک جدید" (در سایدبار همیشه قابل دسترس) -->
            <button id="sidebar-new-event" class="sidebar-item">
                <span class="sidebar-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </span>
                <span>New Event / Task</span>
            </button>
            <!-- لیست رویدادهای امروز (در سایدبار) -->
            <div id="sidebar-today-list" class="sidebar-today-list"></div>
            <!-- توجه: سایر آیتم‌ها (Dashboard, Sign In/Out, Buy Coffee) توسط خود کامپوننت مدیریت می‌شود -->
        </div>
    </sidebar-component>

</div>

<!-- =========================== INITIAL LOADER ============================ -->
<div id="initial-loader" class="fullpage-loader">
    <div class="lds-grid">
        <div></div><div></div><div></div>
        <div></div><div></div><div></div>
        <div></div><div></div><div></div>
    </div>
</div>

<!-- :::::::::::::::::::::::::: SCRIPTS :::::::::::::::::::::::::: -->
<script src="assets/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<!-- بارگذاری کامپوننت سایدبار مشترک -->
<script type="module" src="../shared/sidebar-component.js"></script>

<!-- اسکریپت اختصاصی Ravlo (باید برای اتصال به کامپوننت به‌روز شود) -->
<script src="assets/Ravlo.js"></script>

</body>
</html>
